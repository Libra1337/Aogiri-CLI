name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-test:
    name: Lint and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # crates/llm-provider-kit is a public submodule.
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep bubblewrap

      # The sandbox tests run commands under bwrap, which needs unprivileged
      # user namespaces; Ubuntu 24.04 restricts them through AppArmor.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # LYNSHEN_SANDBOX_CI: the Landlock tests (lynshen-sandbox) fail
      # instead of skipping when the kernel lacks Landlock.
      - name: Run tests
        run: cargo test --workspace
        env:
          LYNSHEN_SANDBOX_CI: "1"

      - name: Test the skills mirror builder
        run: python3 deploy/skills-mirror/test_build.py

  # The relay (relay/, Go): vet and the race detector over its tests, v1 and
  # v2 (docs/relay-protocol.md).
  relay:
    name: Relay (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum

      - name: Vet
        working-directory: relay
        run: go vet ./...

      - name: Test (race)
        working-directory: relay
        run: go test -race -count=1 ./...

  # The release workflow already builds Windows binaries, so keep Windows
  # compiling on every PR. Tests are only run on Linux for now, except the
  # shell tests, which run real commands in PowerShell 7, Windows
  # PowerShell and Git Bash (all three are on windows-latest).
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # crates/llm-provider-kit is a public submodule.
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Build workspace (including tests)
        run: cargo build --workspace --all-targets

      - name: Shell tests
        run: cargo test -p lynshen-agent-core --lib shell::tests

      # An engine's job object: ending it ends what the engine started.
      - name: Process group tests
        run: cargo test -p lynshen-agent-core --lib process_group

  # The Windows sandbox (sandbox_windows = "restricted-token", opt-in): the
  # crate's policy checks, then the engine's path through the real
  # `lynshen __sandbox-exec` runner and the shells. Both tests print every
  # check; they use temporary directories only (no secrets, no real
  # profile data).
  sandbox-windows:
    name: Sandbox (Windows)
    runs-on: windows-latest
    env:
      LYNSHEN_SANDBOX_CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy (sandbox crate, Windows code)
        run: cargo clippy -p lynshen-sandbox --all-targets -- -D warnings

      - name: Sandbox crate tests
        run: cargo test -p lynshen-sandbox -- --nocapture

      - name: Engine sandbox test (restricted-token)
        run: cargo test -p lynshen-cli --test windows_sandbox -- --nocapture

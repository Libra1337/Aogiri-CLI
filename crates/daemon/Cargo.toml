[package]
name = "lynshen-daemon"
version.workspace = true
license.workspace = true
authors.workspace = true
edition = "2021"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek = "2"
# A bug report's logs from the phone page (feedback.rs); already in the
# build through lynshen-agent-core.
flate2 = "1"
getrandom = "0.2"
lynshen-agent-core = { path = "../agent-core" }
portable-pty = "0.9"
regex = "1"
# Web Push encryption (RFC 8291): P-256 ECDH, HKDF, AES-128-GCM. Already in
# the build through rustls.
ring = "0.17"
# Pins rustls's crypto provider to ring (already used by ureq) so `wss://`
# relay connections never need aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
snow = { version = "0.10", default-features = false, features = ["std", "use-chacha20poly1305", "use-curve25519", "use-getrandom", "use-sha2"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = "2"

# The computer's idle time, for "not at the computer" notifications.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"]

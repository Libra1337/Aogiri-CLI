[package]
name = "lynshen-agent-core"
version.workspace = true
license.workspace = true
authors.workspace = true
edition = "2021"

[dependencies]
base64 = "0.22"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
ed25519-dalek = "2"
flate2 = "1"
getrandom = "0.2"
libc = "0.2"
llm-provider-kit = { path = "../llm-provider-kit" }
lynshen-sandbox = { path = "../lynshen-sandbox" }
regex = "1"
serde_json = "1"
semver = "1"
sha2 = "0.10"
tar = "0.4"
tiktoken-rs = "0.12"
ureq = { version = "2", features = ["json"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

# device_id.rs (gateway device binding): the SMBIOS system UUID and the
# permanent MACs of the network adapters; process_group.rs: the job object
# a host's engine runs in. Already in the tree through lynshen-sandbox.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
] }
